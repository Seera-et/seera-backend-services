    note: "A different country's law — nothing in this corpus should answer it."
  - id: qa-028
    question: "What does UK company law require for forming a private limited company?"
    language: en
    should_abstain: true
    note: "A different country's law, phrased to closely resemble an in-corpus question — checks the router/retrieval don't get confused by surface similarity to qa-004."
  - id: qa-016
    question: "What does French company law require for forming an SARL?"
    language: en
    should_abstain: true
  - id: qa-017
    question: "Under the United States Federal Sentencing Guidelines, what is the maximum sentence for tax evasion?"
    language: en
    should_abstain: true
    note: >
      Directly targets the contamination risk named in docs/CORPUS.md: a
      United States Sentencing Commission PDF sits in the raw source folder and
      must never be ingested. If this case ever stops abstaining, that file
      likely got ingested by mistake — this citation would resolve correctly
      to a real document that simply is not Ethiopian law, which grounding
      validation cannot catch on its own.
