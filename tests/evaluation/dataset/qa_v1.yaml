  # ---- Verified against real runs, 2026-09-03 -----------------------------
  #
  # Article numbers below were read off answers this corpus actually produced,
  # with each cited article's own title confirming the match (e.g. 499 is
  # "General Conditions Necessary for Formation"). This is the workflow the
  # header describes: run the question, see what came back, record it.
  - id: qa-029
    question: "How do I register a company in Ethiopia?"
    language: en
    expected_document_titles: ["Commercial Code of Ethiopia (Proclamation No. 1243/2021)"]
    expected_article_nos: ["82", "254", "261", "265"]
    should_abstain: false
    note: >
      265 "Registration of the Company in the Commercial Register", 261
      "Auditing Formation Procedure", 254 "General Requirements in Respect of
      Formation", 82 "Persons to be Registered". A broad question that should
      pull several provisions, so it also exercises depth=analyse.
  - id: qa-030
    question: "What is the difference between a share company, a private limited company and a one member private limited company?"
    language: en
    expected_document_titles: ["Commercial Code of Ethiopia (Proclamation No. 1243/2021)"]
    expected_article_nos: ["245", "495", "534"]
    should_abstain: false
    note: >
      The three "Definition" articles, one per entity type. A comparison
      question: retrieval has to find all three, not just the best one.
  - id: qa-031
    question: "What is the minimum capital required to form a private limited company?"
    language: en
    expected_document_titles: ["Commercial Code of Ethiopia (Proclamation No. 1243/2021)"]
    expected_article_nos: ["496"]
    should_abstain: false
    note: >
      Article 496 "Capital" — fifteen thousand Birr minimum, hundred Birr par
      value. A single-provision question with an exact numeric answer, so a
      wrong retrieval is unambiguous rather than arguable.
  - id: qa-032
    question: "How is a one member private limited company incorporated?"
    language: en
    expected_document_titles: ["Commercial Code of Ethiopia (Proclamation No. 1243/2021)"]
    expected_article_nos: ["534", "536"]
    should_abstain: false
    note: >
      534 "Definition" and 536 "Unilateral Declaration: Content and Form".

