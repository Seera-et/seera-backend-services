# Answer-quality evaluation, v1.
#
# Read by tests/evaluation/answer_test.go (`//go:build eval`) against a real,
# already-ingested corpus. This is the harness docs/QA_FEATURE_PLAN.md §8
# specified and that was never built — only the routing eval (routing_v1.yaml)
# existed before this file.
#
# IMPORTANT — this file is deliberately smaller and more conservative than the
# ~50-question mix QA_FEATURE_PLAN.md §8 originally sketched, and it says so
# rather than padding to a round number:
#
#   - Ground truth here is corpus-dependent in a way routing labels are not. An
#     article number is only correct against a specific ingested version, and
#     this dataset was authored without access to a running database — exactly
#     the situation QA_FEATURE_PLAN.md's own risk table warns about ("50
#     questions have no in-corpus answer -> build the dataset against the
#     ingested corpus, not before it"). Inventing specific article numbers to
#     hit a target count would mean fabricating the exact kind of legal claim
#     this whole system exists to prevent — in its own test fixtures.
#   - `expected_document_titles` must match this database's actual
#     `legal_documents.title` value exactly (`SELECT title FROM
#     legal_documents`) — the titles below are written from the document
#     descriptions in QA_FEATURE_PLAN.md's ingestion log, not copied from a
#     live row, and may need correcting.
#   - `expected_article_nos` is filled in only for cases verified against a
#     real run — three from QA_FEATURE_PLAN.md's "First real run" (2026-08-17,
#     against Neon) and six more from live runs on 2026-09-03, where each
#     cited article's own title confirmed the match. Every other non-abstain
#     case names a document only, and that distinction is now reported: see
#     the by_granularity block in results/retrieval_latest.json. A
#     document-level case cannot measure Precision@5 on a corpus that is 94%
#     one document — any chunk from the Commercial Code counts as a hit —
#     real, answerable questions about topics a Commercial Code covers
#     (formation, shares, partnerships, negotiable instruments, dissolution,
#     governance, registration), deliberately avoiding topics like employment
#     or tax that live in instruments not confirmed to be in this corpus.
#   - Grow this file against your own ingested corpus: add the article numbers
#     and expected_supporting_text once you've run a question for real and can
#     see what came back. That is the intended workflow, not a gap to apologize
#     for.
#
# Two Amharic cases only, for the same reason: composing more from scratch here
# risks introducing exactly the kind of ungrounded confidence this project is
# built against. See memory / docs/CORPUS.md on the state of Amharic sources.

cases:
  # ---- Verified against a real run (QA_FEATURE_PLAN.md, 2026-08-17) --------
  - id: qa-001
    question: "What powers does the Emperor have under the 1931 Constitution?"
    language: en
    expected_document_titles: ["The 1931 Constitution of Ethiopia"]
    expected_article_nos: ["5", "6", "9", "11", "16", "17"]
    should_abstain: false
    note: >
      Verified: a real run against an ingested corpus returned a grounded
      answer citing exactly these six articles (QA_FEATURE_PLAN.md, "First
      real run"). expected_document_titles must still be checked against this
      corpus's actual stored title.
  - id: qa-002
    question: "What does Article 16 of the 1931 Constitution say?"
    language: en
    expected_document_titles: ["The 1931 Constitution of Ethiopia"]
    expected_article_nos: ["16"]
    should_abstain: false
    note: "An exact-article query for this put Article 16 at rank 1 in the same verified run."
  - id: qa-003
    question: "አንቀጽ 16 ምን ይላል?"
    language: am
    expected_document_titles: ["The 1931 Constitution of Ethiopia"]
    expected_article_nos: ["16"]
    should_abstain: false
    note: "Amharic: what does Article 16 say? Same verified article as qa-002, same phrasing pattern already used in routing_v1.yaml's legal-008."

